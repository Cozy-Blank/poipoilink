https://poipoilink.vercel.app/<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    :root {

    }

    .container {

    }

    /* 上段固定イラストバナー */
   /* 上段固定イラストバナー */
    .top-banner-card {
      width: 100%;
      aspect-ratio: 3.2 / 1; /* ★高さ固定を廃止し、横幅に応じた絶妙な比率に設定 */
      max-height: 180px;      /* PCでも広がりすぎない上限設定 */

      background-color: #ffffff;
      background-image: var(--banner-image-url);
      background-size: cover;

    input[type="text"], textarea, select {

    /* プレビュー領域 */
    .preview-card {

      justify-content: flex-end;

    .btn-action {
      padding: 8px 14px;

    /* フィルタータブ */
    .tabs-wrapper {

    .tabs-wrapper::-webkit-scrollbar {

      white-space: nowrap;
    }

    .tab.active {
      color: #fff;

    }

    /* 保存リスト */
    .task-list {
      display: flex;

    }

    .task-item {

      display: flex;

    .task-title {
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;

      line-height: 1.5;
    }

    .task-memo {
      font-size: 0.8rem;
      color: #475569;
      background: #fdf2f8;

      border-radius: 8px;
      border-left: 3px solid var(--primary);

      word-break: break-all;

    .link-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-dark);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--primary-light);
      padding: 6px 12px;
      border-radius: 8px;
      word-break: break-all;
      width: fit-content;
      margin-top: 2px;
    }

    .item-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #f43f5e;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 700;
      background: #ffffff;
      border-radius: 20px;
      border: 2px dashed var(--border-color);
    }
  </style>
</head>
<body>

<header>
  <h1>自動判定テキスト化</h1>
  <div class="sub-title">poipoilink</div>
</header>

<div class="container">
  <!-- 上段固定イラストエリア -->
  <div class="top-banner-card"></div>

  <!-- 入力フォーム -->
  <div class="card">
    <fieldset class="fieldset">
      <legend>リンク先URLを貼り付け</legend>
      <input type="text" id="urlInput" placeholder="リンク先URLを貼り付け" oninput="autoDetectGenre()">
    </fieldset>

    <button class="btn-fetch" onclick="fetchPostText()">
      📥 本文を取得する
    </button>

    <!-- 取得テキスト プレビュー画面 -->
    <div class="preview-card" id="previewArea" style="display: none;">
      <div class="preview-header">
        <div class="preview-author" id="previewAuthor">ユーザー名</div>
      </div>
      <div class="preview-body" id="previewBody">ここに本文が入ります</div>
      <div class="action-row">
        <button class="btn-action btn-copy" onclick="copyText()">📋 コピー</button>
        <button class="btn-action btn-save" onclick="addLink()">💾 アプリに保存</button>
      </div>
    </div>

    <!-- ジャンル選択 -->
    <fieldset class="fieldset">
      <legend>ジャンル（自動判定・変更可能）</legend>
      <select id="genreSelect">
        <option value="学び">📚 学び</option>
        <option value="オンラインサロン">💬 オンラインサロン</option>
        <option value="社会問題">🌐 社会問題</option>
        <option value="健康">🌿 健康</option>
        <option value="防災">⛑️ 防災</option>
        <option value="暮らし">🏠 暮らし</option>
        <option value="アイデア">💡 アイデア</option>
        <option value="レシピ">🍳 レシピ</option>
        <option value="カスタムAI">🤖 カスタムAI</option>
        <option value="法律">⚖️ 法律</option>
        <option value="お金">💰 お金</option>
        <option value="読書映画">🎬 読書映画</option>
        <option value="法則">🔍 法則</option>
        <option value="その他" selected>✨ その他</option>
      </select>
    </fieldset>

    <!-- メモ欄 -->
    <fieldset class="fieldset">
      <legend>メモ（空欄のままでもOK）</legend>
      <textarea id="memoInput" placeholder="メモを入力..."></textarea>
    </fieldset>

    <button class="btn-action btn-save" style="width:100%; justify-content:center; padding:12px; font-size:0.95rem;" onclick="addLink()">
      💾 直接リストに保存する
    </button>
  </div>

  <!-- フィルタータブ -->
  <div class="tabs-wrapper">
    <div class="tabs" id="filterTabs">
      <div class="tab active" onclick="setFilter('all', this)">すべて</div>
      <div class="tab" onclick="setFilter('学び', this)">📚 学び</div>
      <div class="tab" onclick="setFilter('オンラインサロン', this)">💬 オンラインサロン</div>
      <div class="tab" onclick="setFilter('社会問題', this)">🌐 社会問題</div>
      <div class="tab" onclick="setFilter('健康', this)">🌿 健康</div>
      <div class="tab" onclick="setFilter('防災', this)">⛑️ 防災</div>
      <div class="tab" onclick="setFilter('暮らし', this)">🏠 暮らし</div>
      <div class="tab" onclick="setFilter('アイデア', this)">💡 アイデア</div>
      <div class="tab" onclick="setFilter('レシピ', this)">🍳 レシピ</div>
      <div class="tab" onclick="setFilter('カスタムAI', this)">🤖 カスタムAI</div>
      <div class="tab" onclick="setFilter('法律', this)">⚖️ 法律</div>
      <div class="tab" onclick="setFilter('お金', this)">💰 お金</div>
      <div class="tab" onclick="setFilter('読書映画', this)">🎬 読書映画</div>
      <div class="tab" onclick="setFilter('法則', this)">🔍 法則</div>
      <div class="tab" onclick="setFilter('その他', this)">✨ その他</div>
    </div>
  </div>

  <!-- リスト表示部 -->
  <div id="linkList" class="task-list"></div>
</div>

<script>
  let currentFilter = 'all';
  let fetchedAuthor = '';
  let fetchedBodyText = '';
  let links = JSON.parse(localStorage.getItem('poipoilinks') || '[]');

  const keywordMap = {
    'オンラインサロン': ['サロン', 'コミュニティ', 'メンバー', 'オフ会', '限定配信', 'discord', 'slack'],
    '社会問題': ['社会問題', '事件', '事故', 'ニュース', '政治', '環境', '貧困', '少子化', '少子高齢化', '差別', '人権', '福祉', '税金問題', '不祥事', '批判', '議論', 'SDGs'],
    '学び': ['学び', '自己啓発', 'マインド', '思考', '勉強', '学習', '習慣', '成長', '成功', 'モチベーション', '読書', '知識', 'スキル', '心理学', '哲学'],
    '健康': ['健康', '睡眠', '食事', '栄養', '運動', '筋トレ', 'ダイエット', 'メンタル', 'ヘルス', '予防', '医療', 'ストレッチ', 'ヨガ'],
    '防災': ['防災', '地震', '災害', '避難', '備蓄', 'ハザード', '台風', '救急', '安全', '緊急'],
    '暮らし': ['暮らし', '生活', '掃除', '収納', 'インテリア', '家事', '便利グッズ', '断捨離', 'ライフハック', '部屋'],
    'アイデア': ['アイデア', 'ひらめき', '企画', '発想', 'デザイン', 'クリエイティブ', 'ブレスト', '改善', '仕組み'],
    'レシピ': ['レシピ', '料理', '献立', 'ごはん', 'スイーツ', '時短料理', '作り置き', 'おやつ', 'クッキング', '美味しい'],
    'カスタムAI': ['ai', 'カスタムai', 'chatgpt', 'prompt', 'プロンプト', 'claude', 'gemini', '生成ai', 'gpt', '自動化', 'llm'],
    '法律': ['法律', '契約', '規約', '著作権', '権利', '弁護士', '法務', '労働法', 'コンプライアンス', 'ルール'],
    'お金': ['お金', '投資', '節約', '貯金', '資産運用', '税金', '株', 'nisa', '副業', '会計', 'マネー', '家計', 'btc', 'bitcoin', '暗号資産', '仮想通貨'],
    '読書映画': ['読書', '映画', '本', 'シネマ', '小説', 'レビュー', '感想', 'おすすめ本', '映画鑑賞', 'アニメ', 'ドラマ'],
    '法則': ['法則', '密議', '象徴', '智慧', 'フリーメーソン', '神殿', 'pi', '重力', 'ポリフォニック', '倍音', 'フィボナッチ', '黄金比', 'オクターブ', '宇宙', '波動', '原理', '真理']
  };

  function normalizeXUrl(inputUrl) {
    let url = inputUrl.trim();
    url = url.replace('https://x.com/', 'https://twitter.com/').replace('http://x.com/', 'https://twitter.com/');
    url = url.split('?')[0];
    return url;
  }

  async function fetchPostText() {
    const rawUrl = document.getElementById('urlInput').value.trim();
    if (!rawUrl) {
      alert('URLを入力してください');
      return;
    }

    const previewArea = document.getElementById('previewArea');
    const previewAuthor = document.getElementById('previewAuthor');
    const previewBody = document.getElementById('previewBody');

    previewArea.style.display = 'block';
    previewAuthor.textContent = '取得中...';
    previewBody.textContent = 'ポスト本文を取得しています...';

    const targetUrl = normalizeXUrl(rawUrl);

    // 1. FxTwitter / FixupX API
    try {
      const match = targetUrl.match(/status\/(\d+)/);
      if (match && match[1]) {
        const statusId = match[1];
        const res = await fetch(`https://api.fxtwitter.com/status/${statusId}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.tweet) {
            fetchedAuthor = data.tweet.author ? `${data.tweet.author.name} (@${data.tweet.author.screen_name})` : 'X User';
            fetchedBodyText = data.tweet.text || '';
            showSuccess(fetchedAuthor, fetchedBodyText);
            return;
          }
        }
      }
    } catch (e) {}

    // 2. oEmbed API + corsproxy
    try {
      const oembedUrl = `https://publish.twitter.com/oembed?url=${encodeURIComponent(targetUrl)}&omit_script=true`;
      const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(oembedUrl)}`);
      if (res.ok) {
        const json = await res.json();
        fetchedAuthor = json.author_name || 'X User';
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = json.html;
        let text = tempDiv.innerText || tempDiv.textContent || '';
        text = text.replace(/—\s*.*$/, '').trim();

        fetchedBodyText = text;
        showSuccess(fetchedAuthor, fetchedBodyText);
        return;
      }
    } catch (e) {}

    // 3. AllOrigins Proxy
    try {
      const oembedUrl = `https://publish.twitter.com/oembed?url=${encodeURIComponent(targetUrl)}&omit_script=true`;
      const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(oembedUrl)}`);
      const data = await res.json();
      if (data.contents) {
        const json = JSON.parse(data.contents);
        fetchedAuthor = json.author_name || 'X User';
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = json.html;
        let text = tempDiv.innerText || tempDiv.textContent || '';
        text = text.replace(/—\s*.*$/, '').trim();

        fetchedBodyText = text;
        showSuccess(fetchedAuthor, fetchedBodyText);
        return;
      }
    } catch (e) {}

    previewAuthor.textContent = 'お知らせ';
    previewBody.textContent = '本文の自動取得に失敗しました。直接メモ欄に内容を入力して保存してください。';
  }

  function showSuccess(author, body) {
    document.getElementById('previewAuthor').textContent = author;
    document.getElementById('previewBody').textContent = body;
    autoDetectGenre(body);
  }

  function autoDetectGenre(extraText = '') {
    const text = (document.getElementById('urlInput').value + ' ' + extraText).toLowerCase();
    let foundGenre = 'その他';

    for (const [genre, keywords] of Object.entries(keywordMap)) {
      if (keywords.some(kw => text.includes(kw.toLowerCase()))) {
        foundGenre = genre;
        break;
      }
    }

    document.getElementById('genreSelect').value = foundGenre;
  }

  function copyText() {
    if (!fetchedBodyText) return;
    navigator.clipboard.writeText(fetchedBodyText).then(() => {
      alert('本文をコピーしました！');
    });
  }

  function setFilter(filter, element) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    element.classList.add('active');
    renderLinks();
  }

  function addLink() {
    const urlInput = document.getElementById('urlInput');
    const memoInput = document.getElementById('memoInput');
    const genreSelect = document.getElementById('genreSelect');

    const url = urlInput.value.trim();
    const memo = memoInput.value.trim();
    const genre = genreSelect.value || 'その他';
    const bodyText = fetchedBodyText;

    if (!url && !memo && !bodyText) {
      alert('URL、本文、またはメモを入力してください');
      return;
    }

    const newLink = {
      id: Date.now(),
      url: url,
      author: fetchedAuthor,
      bodyText: bodyText,
      memo: memo,
      genre: genre,
      createdAt: new Date().toLocaleDateString('ja-JP')
    };

    links.unshift(newLink);
    saveAndRender();

    urlInput.value = '';
    memoInput.value = '';
    fetchedBodyText = '';
    fetchedAuthor = '';
    document.getElementById('previewArea').style.display = 'none';
    document.getElementById('genreSelect').value = 'その他';
  }

  function deleteLink(id) {
    links = links.filter(l => l.id !== id);
    saveAndRender();
  }

  function copyItemText(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('本文をコピーしました！');
    });
  }

  function saveAndRender() {
    localStorage.setItem('poipoilinks', JSON.stringify(links));
    renderLinks();
  }

  function renderLinks() {
    const listEl = document.getElementById('linkList');
    const filteredLinks = links.filter(link => {
      if (currentFilter === 'all') return true;
      const linkGenre = link.genre || 'その他';
      return linkGenre === currentFilter;
    });

    if (filteredLinks.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div>🌸 保存されたストックはありません</div>
          <div style="font-size: 0.75rem; margin-top: 4px; font-weight: normal;">URLを入力して「本文を取得」を押すと保存できます！</div>
        </div>
      `;
      return;
    }

    listEl.innerHTML = filteredLinks.map(link => {
      const displayContent = link.bodyText || link.memo || '無題のストック';

      return `
        <div class="task-item">
          <div class="task-header">
            <span class="badge">${escapeHtml(link.genre || 'その他')}</span>
            <span style="font-size:0.75rem; color: var(--text-muted); font-weight:700;">${link.createdAt}</span>
          </div>
          ${link.author ? `<div style="font-size:0.75rem; font-weight:800; color:var(--text-muted);">${escapeHtml(link.author)}</div>` : ''}
          <div class="task-title">${escapeHtml(displayContent)}</div>
          
          ${(link.memo && link.bodyText) ? `<div class="task-memo">💡 <b>メモ:</b> ${escapeHtml(link.memo)}</div>` : ''}

          ${link.url ? `
            <div>
              <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="link-box">
                🔗 ポストを開く
              </a>
            </div>
          ` : ''}

          <div class="item-actions">
            <button class="btn-action btn-copy" style="padding:4px 8px;" onclick="copyItemText(\`${escapeHtml(displayContent)}\`)">📋 コピー</button>
            <button class="delete-btn" onclick="deleteLink(${link.id})">削除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }

  renderLinks();
</script>
