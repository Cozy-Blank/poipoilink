<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポイポイリンク</title>

    <!-- OGP (LINE・SNS共有設定) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ポイポイリンク">
    <meta property="og:description" content="X（Twitter）の投稿リンクや各種ウェブページをカテゴリ別に保存・管理できるツールです。">
    <meta property="og:url" content="https://Cozy-Blank.github.io/poipoilink/">
    <meta property="og:image" content="https://Cozy-Blank.github.io/poipoilink/henairink.png">
    <meta property="og:site_name" content="ポイポイリンク">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ポイポイリンク">
    <meta name="twitter:description" content="X（Twitter）の投稿リンクや各種ウェブページをカテゴリ別に保存・管理できるツールです。">
    <meta name="twitter:image" content="https://Cozy-Blank.github.io/poipoilink/henairink.png">

    <!-- ファビコン・ホーム画面（ウェブアプリ）用アイコン設定 -->
    <link rel="icon" href="https://Cozy-Blank.github.io/poipoilink/henairink.png" type="image/png">
    <link rel="apple-touch-icon" href="https://Cozy-Blank.github.io/poipoilink/henairink.png">
    
    <!-- iOS PWA設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ポイポイリンク">

    <style>
        :root {
            --primary-color: #ff6b81;
            --primary-hover: #ff4757;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-color: #ffccd5;
            --shadow-color: rgba(255, 107, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .input-section {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow-color);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        button.add-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.add-btn:hover {
            background-color: var(--primary-hover);
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .tab {
            padding: 8px 16px;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            color: #666;
        }

        .tab.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .link-genre {
            display: inline-block;
            background-color: #ffe0e6;
            color: var(--primary-color);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            width: fit-content;
            font-weight: bold;
        }

        .link-text {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-color);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .link-url {
            font-size: 12px;
            color: #0066cc;
            text-decoration: none;
            word-break: break-all;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 12px;
            cursor: pointer;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ポイポイリンク</h1>
    </header>

    <div class="input-section">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="URLまたは共有リンクを貼り付け">
            <select id="genreSelect">
                <option value="自動判定">ジャンル自動判定</option>
                <option value="プロンプト">プロンプト</option>
                <option value="画像生成">画像生成</option>
                <option value="動画生成">動画生成</option>
                <option value="音楽・音声">音楽・音声</option>
                <option value="便利ツール">便利ツール</option>
                <option value="その他">その他</option>
            </select>
            <button class="add-btn" onclick="addLink()">保存する</button>
        </div>
    </div>

    <div class="tabs" id="tabContainer">
        <div class="tab active" onclick="filterGenre('すべて')">すべて</div>
        <div class="tab" onclick="filterGenre('プロンプト')">プロンプト</div>
        <div class="tab" onclick="filterGenre('画像生成')">画像生成</div>
        <div class="tab" onclick="filterGenre('動画生成')">動画生成</div>
        <div class="tab" onclick="filterGenre('音楽・音声')">音楽・音声</div>
        <div class="tab" onclick="filterGenre('便利ツール')">便利ツール</div>
        <div class="tab" onclick="filterGenre('その他')">その他</div>
    </div>

    <div class="link-list" id="linkList">
        <!-- リンクカードがここに挿入されます -->
    </div>

    <script>
        let links = JSON.parse(localStorage.getItem('poipoi_links') || '[]');
        let currentFilter = 'すべて';

        const keywordMap = {
            'プロンプト': ['prompt', 'プロンプト', 'gpt', 'claude', 'gemini', 'chatgpt'],
            '画像生成': ['midjourney', 'stable diffusion', 'dall-e', 'flux', '画像', 'イラスト', '生成ai'],
            '動画生成': ['runway', 'sora', 'pika', 'kling', 'luma', '動画'],
            '音楽・音声': ['suno', 'udio', 'elevenlabs', '音声', '音楽', 'ボイス'],
            '便利ツール': ['tool', 'ツール', '便利', '効率化', 'アプリ']
        };

        function saveLinks() {
            localStorage.setItem('poipoi_links', JSON.stringify(links));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

        function autoDetectGenre(text, url) {
            const combined = (text + ' ' + url).toLowerCase();
            for (const [genre, keywords] of Object.entries(keywordMap)) {
                if (keywords.some(kw => combined.includes(kw))) {
                    return genre;
                }
            }
            return 'その他';
        }

        async function fetchPostText(url) {
            try {
                const fxtwitterUrl = url.replace(/https:\/\/(twitter|x)\.com/, 'https://api.fxtwitter.com');
                const res = await fetch(fxtwitterUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.tweet && data.tweet.text) {
                        return data.tweet.text;
                    }
                }
            } catch (e) {
                console.log('FxTwitter fetch failed, trying oEmbed...');
            }

            try {
                const targetOembed = `https://publish.twitter.com/oembed?url=${encodeURIComponent(url)}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetOembed)}`;
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.html) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = data.html;
                        return tempDiv.innerText.replace(/— .*/, '').trim();
                    }
                }
            } catch (e) {
                console.log('Proxy oEmbed failed');
            }

            return '';
        }

        async function addLink() {
            const urlInput = document.getElementById('urlInput');
            const genreSelect = document.getElementById('genreSelect');
            
            const rawUrl = urlInput.value.trim();
            if (!rawUrl) return;

            let selectedGenre = genreSelect.value;
            let fetchedText = '';

            if (rawUrl.includes('x.com') || rawUrl.includes('twitter.com')) {
                fetchedText = await fetchPostText(rawUrl);
            }

            if (selectedGenre === '自動判定') {
                selectedGenre = autoDetectGenre(fetchedText, rawUrl);
            }

            const newLink = {
                id: Date.now(),
                url: rawUrl,
                genre: selectedGenre,
                text: fetchedText,
                createdAt: new Date().toLocaleDateString('ja-JP')
            };

            links.unshift(newLink);
            saveLinks();
            renderLinks();

            urlInput.value = '';
            genreSelect.value = '自動判定';
        }

        function deleteLink(id) {
            if (confirm('このリンクを削除してもよろしいですか？')) {
                links = links.filter(item => item.id !== id);
                saveLinks();
                renderLinks();
            }
        }

        function updateGenre(id, newGenre) {
            const item = links.find(l => l.id === id);
            if (item) {
                item.genre = newGenre;
                saveLinks();
                renderLinks();
            }
        }

        function filterGenre(genre) {
            currentFilter = genre;
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                if (tab.innerText === genre) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            renderLinks();
        }

        function renderLinks() {
            const container = document.getElementById('linkList');
            container.innerHTML = '';

            const filteredLinks = currentFilter === 'すべて' 
                ? links 
                : links.filter(l => l.genre === currentFilter);

            if (filteredLinks.length === 0) {
                container.innerHTML = '<div class="empty-message">保存されているリンクはありません</div>';
                return;
            }

            filteredLinks.forEach(item => {
                const card = document.createElement('div');
                card.className = 'link-card';

                const safeText = escapeHtml(item.text);
                const safeUrl = escapeHtml(item.url);

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <select onchange="updateGenre(${item.id}, this.value)" style="width:auto; padding:2px 5px; font-size:12px;">
                            <option value="プロンプト" ${item.genre === 'プロンプト' ? 'selected' : ''}>プロンプト</option>
                            <option value="画像生成" ${item.genre === '画像生成' ? 'selected' : ''}>画像生成</option>
                            <option value="動画生成" ${item.genre === '動画生成' ? 'selected' : ''}>動画生成</option>
                            <option value="音楽・音声" ${item.genre === '音楽・音声' ? 'selected' : ''}>音楽・音声</option>
                            <option value="便利ツール" ${item.genre === '便利ツール' ? 'selected' : ''}>便利ツール</option>
                            <option value="その他" ${item.genre === 'その他' ? 'selected' : ''}>その他</option>
                        </select>
                        <span style="font-size:11px; color:#999;">${item.createdAt}</span>
                    </div>
                    ${safeText ? `<div class="link-text">${safeText}</div>` : ''}
                    <a href="${safeUrl}" target="_blank" class="link-url">${safeUrl}</a>
                    <div class="card-actions">
                        <button class="delete-btn" onclick="deleteLink(${item.id})">削除</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 初期描画
        renderLinks();
    </script>
</body>
</html>
