<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>poipoilink - Xポストテキスト化 & WEBストック</title>
  <style>
    :root {
      --primary: #ec4899;
      --primary-dark: #be185d;
      --primary-light: #fce7f3;
      --bg: #fdf2f8;
      --card-bg: #ffffff;
      --text-main: #831843;
      --text-muted: #9d174d;
      --border-color: #fbcfe8;
      --bg-image-url: url('https://i.ibb.co/pmYQ4QH/rink.png');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* ヘッダー */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(236, 72, 153, 0.05);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px 12px 0 12px;
    }

    /* 入力フォームカード */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.06);
      margin-bottom: 14px;
      border: 2px solid var(--border-color);
    }

    .fieldset {
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fff5f8;
    }

    .fieldset legend {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--primary-dark);
      padding: 0 6px;
    }

    input[type="text"], textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 0.9rem;
      outline: none;
      color: var(--text-main);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-fetch {
      width: 100%;
      padding: 10px;
      background: #fff;
      color: var(--primary-dark);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-fetch:active {
      background: var(--primary-light);
    }

    /* プレビュー領域 */
    .preview-card {
      background: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .preview-author {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .preview-body {
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-action {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-copy {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-save {
      background: var(--primary-dark);
      color: #fff;
    }

    /* タグ選択 */
    .section-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .auto-hint {
      font-size: 0.7rem;
      font-weight: normal;
      color: var(--primary-dark);
      opacity: 0.8;
    }

    .type-selector-wrapper {
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .type-selector-wrapper::-webkit-scrollbar {
      display: none;
    }

    .type-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .type-btn {
      padding: 6px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s;
    }

    .type-btn.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 4px rgba(236, 72, 153, 0.2);
    }

    /* フィルタータブ */
    .tabs-wrapper {
      overflow-x: auto;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tabs {
      display: flex;
      gap: 6px;
      width: max-content;
      padding-bottom: 4px;
    }

    .tab {
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      white-space: nowrap;
    }

    .tab.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    /* 保存リスト */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background-color: var(--card-bg);
      background-image: linear-gradient(rgba(255, 255, 255, 0.90), rgba(255, 255, 255, 0.90)), var(--bg-image-url);
      background-size: cover;
      background-position: center;
      border-radius: 18px;
      padding: 14px 16px;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.05);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .task-title {
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-main);
      line-height: 1.5;
    }

    .link-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-dark);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--primary-light);
      padding: 6px 12px;
      border-radius: 8px;
      word-break: break-all;
      width: fit-content;
      margin-top: 4px;
    }

    .item-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #f43f5e;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 700;
      background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), var(--bg-image-url);
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      border: 2px dashed var(--border-color);
    }
  </style>
</head>
<body>

<header>
  <h1>🖤 Xポスト テキスト化 & poipoilink</h1>
</header>

<div class="container">
  <!-- 入力フォーム -->
  <div class="card">
    <fieldset class="fieldset">
      <legend>XのポストURLを貼り付け</legend>
      <input type="text" id="urlInput" placeholder="https://x.com/username/status/..." oninput="autoDetectTags()">
    </fieldset>

    <button class="btn-fetch" onclick="fetchPostText()">
      📥 本文を取得する
    </button>

    <!-- 取得テキスト プレビュー画面 -->
    <div class="preview-card" id="previewArea" style="display: none;">
      <div class="preview-author" id="previewAuthor">ユーザー名</div>
      <div class="preview-body" id="previewBody">ここに本文が入ります</div>
      <div class="action-row">
        <button class="btn-action btn-copy" onclick="copyText()">📋 コピー</button>
        <button class="btn-action btn-save" onclick="addLink()">💾 アプリに保存</button>
      </div>
    </div>

    <fieldset class="fieldset">
      <legend>メモ（直接入力も可）</legend>
      <textarea id="memoInput" placeholder="本文やメモを入力..." oninput="autoDetectTags()"></textarea>
    </fieldset>

    <span class="section-label">
      タグ（自動判定・手動変更可）
      <span class="auto-hint">※複数選択OK</span>
    </span>

    <div class="type-selector-wrapper">
      <div class="type-selector" id="tagSelector">
        <button class="type-btn" data-tag="学び" onclick="toggleTag(this)">📚 学び</button>
        <button class="type-btn" data-tag="健康" onclick="toggleTag(this)">🌿 健康</button>
        <button class="type-btn" data-tag="防災" onclick="toggleTag(this)">⛑️ 防災</button>
        <button class="type-btn" data-tag="暮らし" onclick="toggleTag(this)">🏠 暮らし</button>
        <button class="type-btn" data-tag="アイデア" onclick="toggleTag(this)">💡 アイデア</button>
        <button class="type-btn" data-tag="レシピ" onclick="toggleTag(this)">🍳 レシピ</button>
        <button class="type-btn" data-tag="カスタムAI" onclick="toggleTag(this)">🤖 カスタムAI</button>
        <button class="type-btn" data-tag="法律" onclick="toggleTag(this)">⚖️ 法律</button>
        <button class="type-btn" data-tag="お金" onclick="toggleTag(this)">💰 お金</button>
        <button class="type-btn" data-tag="読書映画" onclick="toggleTag(this)">🎬 読書映画</button>
        <button class="type-btn" data-tag="法則" onclick="toggleTag(this)">🔍 法則</button>
        <button class="type-btn" data-tag="その他" onclick="toggleTag(this)">✨ その他</button>
      </div>
    </div>

    <button class="btn-action btn-save" style="width:100%; justify-content:center; padding:12px; font-size:0.95rem;" onclick="addLink()">
      💾 直接リストに保存する
    </button>
  </div>

  <!-- 保存リストのフィルタータブ -->
  <div class="tabs-wrapper">
    <div class="tabs" id="filterTabs">
      <div class="tab active" onclick="setFilter('all', this)">すべて</div>
      <div class="tab" onclick="setFilter('学び', this)">📚 学び</div>
      <div class="tab" onclick="setFilter('健康', this)">🌿 健康</div>
      <div class="tab" onclick="setFilter('防災', this)">⛑️ 防災</div>
      <div class="tab" onclick="setFilter('暮らし', this)">🏠 暮らし</div>
      <div class="tab" onclick="setFilter('アイデア', this)">💡 アイデア</div>
      <div class="tab" onclick="setFilter('レシピ', this)">🍳 レシピ</div>
      <div class="tab" onclick="setFilter('カスタムAI', this)">🤖 カスタムAI</div>
      <div class="tab" onclick="setFilter('法律', this)">⚖️ 法律</div>
      <div class="tab" onclick="setFilter('お金', this)">💰 お金</div>
      <div class="tab" onclick="setFilter('読書映画', this)">🎬 読書映画</div>
      <div class="tab" onclick="setFilter('法則', this)">🔍 法則</div>
      <div class="tab" onclick="setFilter('その他', this)">✨ その他</div>
    </div>
  </div>

  <!-- リスト表示部 -->
  <div id="linkList" class="task-list"></div>
</div>

<script>
  let manualTags = [];
  let currentFilter = 'all';
  let fetchedAuthor = '';
  let fetchedBodyText = '';
  let links = JSON.parse(localStorage.getItem('poipoilinks') || '[]');

  // ジャンルごとの自動判定キーワード辞書
  const keywordMap = {
    '学び': ['学び', '自己啓発', 'マインド', '思考', '勉強', '学習', '習慣', '成長', '成功', 'モチベーション', '読書', '知識', 'スキル', '心理学', '哲学'],
    '健康': ['健康', '睡眠', '食事', '栄養', '運動', '筋トレ', 'ダイエット', 'メンタル', 'ヘルス', '予防', '医療', 'ストレッチ', 'ヨガ'],
    '防災': ['防災', '地震', '災害', '避難', '備蓄', 'ハザード', '台風', '救急', '安全', '緊急'],
    '暮らし': ['暮らし', '生活', '掃除', '収納', 'インテリア', '家事', '便利グッズ', '断捨離', 'ライフハック', '部屋'],
    'アイデア': ['アイデア', 'ひらめき', '企画', '発想', 'デザイン', 'クリエイティブ', 'ブレスト', '改善', '仕組み'],
    'レシピ': ['レシピ', '料理', '献立', 'ごはん', 'スイーツ', '時短料理', '作り置き', 'おやつ', 'クッキング', '美味しい'],
    'カスタムAI': ['AI', 'カスタムAI', 'ChatGPT', 'Prompt', 'プロンプト', 'Claude', 'Gemini', '生成AI', 'GPT', '自動化', 'LLM'],
    '法律': ['法律', '契約', '規約', '著作権', '権利', '弁護士', '法務', '労働法', 'コンプライアンス', 'ルール'],
    'お金': ['お金', '投資', '節約', '貯金', '資産運用', '税金', '株', 'NISA', '副業', '会計', 'マネー', '家計'],
    '読書映画': ['読書', '映画', '本', 'シネマ', '小説', 'レビュー', '感想', 'おすすめ本', '映画鑑賞', 'アニメ', 'ドラマ'],
    '法則': ['法則', '密議', '象徴', '智慧', 'フリーメーソン', '神殿', 'pi', '重力', 'ポリフォニック', '倍音', 'フィボナッチ', '黄金比', 'オクターブ', '宇宙', '波動', '原理', '真理']
  };

  // 本文自動取得機能（制限回避プロキシ対応）
  async function fetchPostText() {
    const urlInput = document.getElementById('urlInput').value.trim();
    if (!urlInput) {
      alert('XのポストURLを入力してください');
      return;
    }

    const previewArea = document.getElementById('previewArea');
    const previewAuthor = document.getElementById('previewAuthor');
    const previewBody = document.getElementById('previewBody');

    previewArea.style.display = 'block';
    previewAuthor.textContent = '取得中...';
    previewBody.textContent = 'ポスト本文を取得しています...';

    try {
      // oEmbed API 経由で取得
      const targetUrl = encodeURIComponent(urlInput);
      const oembedUrl = `https://publish.twitter.com/oembed?url=${targetUrl}&omit_script=true`;
      
      // CORS回避用プロキシ
      const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(oembedUrl)}`);
      const data = await res.json();
      
      if (data.contents) {
        const json = JSON.parse(data.contents);
        fetchedAuthor = json.author_name || 'X User';
        
        // HTMLタグを除去して純粋なテキスト抽出（途切り制約を極力解除）
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = json.html;
        
        // Blockquoteからテキストを綺麗に復元
        let text = tempDiv.innerText || tempDiv.textContent || '';
        text = text.replace(/—\s*.*$/, '').trim(); // 投稿者クレジット削除

        fetchedBodyText = text;
        previewAuthor.textContent = fetchedAuthor;
        previewBody.textContent = fetchedBodyText;

        // メモ欄にもセットして自動タグ判定
        document.getElementById('memoInput').value = fetchedBodyText;
        autoDetectTags();
      } else {
        throw new Error('取得できませんでした');
      }
    } catch (e) {
      previewAuthor.textContent = 'お知らせ';
      previewBody.textContent = '本文の自動取得に失敗しました。公開設定を確認するか、直接メモ欄に本文を貼り付けて保存してください。';
    }
  }

  // クリップボードへコピー
  function copyText() {
    if (!fetchedBodyText) return;
    navigator.clipboard.writeText(fetchedBodyText).then(() => {
      alert('本文をコピーしました！');
    });
  }

  // 自動タグ検出
  function autoDetectTags() {
    const text = (document.getElementById('urlInput').value + ' ' + document.getElementById('memoInput').value).toLowerCase();
    let detected = [];
    for (const [tag, keywords] of Object.entries(keywordMap)) {
      if (keywords.some(kw => text.includes(kw.toLowerCase()))) {
        detected.push(tag);
      }
    }

    document.querySelectorAll('#tagSelector .type-btn').forEach(btn => {
      const tag = btn.dataset.tag;
      const isSelected = manualTags.includes(tag) || (manualTags.length === 0 && detected.includes(tag));
      btn.classList.toggle('selected', isSelected);
    });
  }

  // タグ選択トグル
  function toggleTag(btn) {
    const tag = btn.dataset.tag;
    let activeTags = getSelectedTagsFromUI();

    if (activeTags.includes(tag)) {
      activeTags = activeTags.filter(t => t !== tag);
    } else {
      activeTags.push(tag);
    }

    manualTags = [...activeTags];
    document.querySelectorAll('#tagSelector .type-btn').forEach(b => {
      b.classList.toggle('selected', manualTags.includes(b.dataset.tag));
    });
  }

  function getSelectedTagsFromUI() {
    const selected = [];
    document.querySelectorAll('#tagSelector .type-btn.selected').forEach(btn => {
      selected.push(btn.dataset.tag);
    });
    return selected;
  }

  function setFilter(filter, element) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    element.classList.add('active');
    renderLinks();
  }

  // 保存処理
  function addLink() {
    const urlInput = document.getElementById('urlInput');
    const memoInput = document.getElementById('memoInput');
    const url = urlInput.value.trim();
    const memo = memoInput.value.trim() || fetchedBodyText;

    if (!url && !memo) {
      alert('URLまたは本文を入力してください');
      return;
    }

    let finalTags = getSelectedTagsFromUI();
    if (finalTags.length === 0) {
      finalTags = ['その他'];
    }

    const newLink = {
      id: Date.now(),
      url: url,
      author: fetchedAuthor,
      memo: memo || '無題のストック',
      tags: finalTags,
      createdAt: new Date().toLocaleDateString('ja-JP')
    };

    links.unshift(newLink);
    saveAndRender();

    // 画面の初期化
    urlInput.value = '';
    memoInput.value = '';
    fetchedBodyText = '';
    fetchedAuthor = '';
    document.getElementById('previewArea').style.display = 'none';
    manualTags = [];
    document.querySelectorAll('#tagSelector .type-btn').forEach(btn => btn.classList.remove('selected'));
  }

  function deleteLink(id) {
    links = links.filter(l => l.id !== id);
    saveAndRender();
  }

  function copyItemText(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('本文をコピーしました！');
    });
  }

  function saveAndRender() {
    localStorage.setItem('poipoilinks', JSON.stringify(links));
    renderLinks();
  }

  function renderLinks() {
    const listEl = document.getElementById('linkList');
    const filteredLinks = links.filter(link => {
      if (currentFilter === 'all') return true;
      const linkTags = link.tags || ['その他'];
      return linkTags.includes(currentFilter);
    });

    if (filteredLinks.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div>🌸 保存されたストックはありません</div>
          <div style="font-size: 0.75rem; margin-top: 4px; font-weight: normal;">URLを入力して「本文を取得」を押すと保存できます！</div>
        </div>
      `;
      return;
    }

    listEl.innerHTML = filteredLinks.map(link => {
      const linkTags = link.tags || ['その他'];
      const badgesHtml = linkTags.map(t => `<span class="badge">${t}</span>`).join('');

      return `
        <div class="task-item">
          <div class="task-header">
            <div class="badge-container">${badgesHtml}</div>
            <span style="font-size:0.75rem; color: var(--text-muted); font-weight:700;">${link.createdAt}</span>
          </div>
          ${link.author ? `<div style="font-size:0.75rem; font-weight:800; color:var(--text-muted);">${escapeHtml(link.author)}</div>` : ''}
          <div class="task-title">${escapeHtml(link.memo)}</div>
          
          ${link.url ? `
            <div>
              <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="link-box">
                🔗 ポストを開く
              </a>
            </div>
          ` : ''}

          <div class="item-actions">
            <button class="btn-action btn-copy" style="padding:4px 8px;" onclick="copyItemText(\`${escapeHtml(link.memo)}\`)">📋 コピー</button>
            <button class="delete-btn" onclick="deleteLink(${link.id})">削除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }

  renderLinks();
</script>

</body>
</html>
